name: Sync embedded DoH bootstrap catalog

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-doh-catalog.yml"
      - "tools/sync_doh_catalog.py"
      - "tests/test_doh_bootstrap.sh"
      - "ecs.sh"
      - "ipcheck.sh"

permissions:
  contents: write

concurrency:
  group: ecs-doh-bootstrap-catalog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: oneclickvirt/basics
          ref: main
          path: .catalog-basics
      - name: Regenerate standalone catalog from the validated basics manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/sync_doh_catalog.py \
            --input .catalog-basics/network/resolver/endpoints_embed.json \
            --script ecs.sh \
            --script ipcheck.sh
      - name: Verify standalone DNS bootstrap behavior
        shell: bash
        env:
          BASICS_CATALOG: ${{ github.workspace }}/.catalog-basics/network/resolver/endpoints_embed.json
        run: |
          set -euo pipefail
          bash -n ecs.sh
          bash -n ipcheck.sh
          shellcheck -S error ecs.sh ipcheck.sh
          bash tests/test_doh_bootstrap.sh
          git diff --check
      - name: Commit refreshed embedded catalog
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- ecs.sh ipcheck.sh)" ]]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ecs.sh ipcheck.sh
          git commit -m 'chore: refresh embedded DoH bootstrap catalog'
          git push
